# 云南省旅游景点分布图
# 使用 pins 样式，展示各景点在地图上的分布位置

title: "云南 · 旅游景点分布图"
style: pins            # 分布图使用 pins 样式
output: interactive    # 交互式 HTML 地图
show_dates: false
show_labels: true      # 在标记旁常驻显示景点名
export_button: true    # 在地图上加一个「导出图片」按钮

# 高亮整个云南省行政区域（GeoJSON 边界，相对本配置文件路径）
regions:
  - yunnan.geojson

locations:
