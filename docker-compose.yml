services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: travel-map-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - BAILIAN_MODEL=${BAILIAN_MODEL:-qwen3.7-plus}
      - TRAVEL_MAP_TILE_TIMEOUT=8
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 30s
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
